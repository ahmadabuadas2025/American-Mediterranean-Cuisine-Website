[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Online checkout stays off until the owner approves prices, zones and a Stripe account.
  PAYMENTS_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888

# ---------------------------------------------------------------- headers

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    # One policy for the whole site (Decap CMS at /admin needs unpkg + the GitHub API).
    # 'unsafe-inline' scripts: Astro inlines small hydration scripts and JSON-LD.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://plausible.io https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https://api.github.com https://plausible.io https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://api.netlify.com; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com https://github.com https://api.netlify.com; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# -------------------------------------------------------------- redirects

[[redirects]]
  from = "/lunchbox"
  to = "/lunchboxes/"
  status = 301

[[redirects]]
  from = "/catering-trays"
  to = "/trays/"
  status = 301

[[redirects]]
  from = "/build"
  to = "/order/"
  status = 301

[[redirects]]
  from = "/order-builder"
  to = "/order/"
  status = 301

[[redirects]]
  from = "/policies"
  to = "/faq/#policies"
  status = 301
